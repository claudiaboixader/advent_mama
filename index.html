<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendari d'Advent - Qui és qui de petit?</title>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #c41e3a;
            --dark-red: #8b0000;
            --pine-green: #164a2f;
            --snow-white: #fcfbf7;
            --gold: #d4af37;
            --gold-hover: #f3cf65;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d2818 0%, #164a2f 50%, #051b11 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Snow effect canvas */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
            color: var(--snow-white);
            z-index: 2;
            width: 100%;
            max-width: 900px;
        }

        header h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0 2rem;
            z-index: 2;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid var(--gold);
            color: var(--snow-white);
            padding: 0.75rem 2rem;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .tab-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--gold);
            color: var(--pine-green);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        /* Main Container */
        main {
            width: 100%;
            max-width: 1000px;
            padding: 0 1rem 3rem;
            z-index: 2;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Calendar Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.25rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .door {
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .door-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .door:hover .door-inner {
            transform: translateY(-5px);
        }

        .door-front, .door-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            border: 2px solid var(--gold);
